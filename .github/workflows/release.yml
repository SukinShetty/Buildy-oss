# release.yml — installers on version tags (v*), on ONE release per tag.
#
# Two build jobs run on the same tag — Windows (NSIS installer) and macOS (DMG
# for Apple Silicon and Intel, ad-hoc signed, not notarized) — and upload their
# files as workflow artifacts. A single final job then writes one
# SHA256SUMS.txt over every file and puts the files on the release. Only that
# job talks to the Releases API, so two jobs can never race.
#
# Re-releasing the same version: move the tag with a force-update (never delete
# it) and this workflow replaces the files of the EXISTING release in place, one
# at a time (scripts/release-assets.mjs), so every download link keeps working,
# and leaves it published or draft exactly as it was. With no release for the
# tag yet it creates a DRAFT. Nothing is ever published here: a human does that.
#
# Guarded to the canonical repo so forks pushing tags don't try to cut releases.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    if: github.repository == 'SukinShetty/mybuildy'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: npm 10+ crashes with an arborist
      # "edgesOut" error on a clean install without it (same as ci.yml).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      # Tag, package.json and the packaged app must all carry the same version.
      - name: Check versions agree
        run: node scripts/check-release-version.mjs ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/MyBuildy-Setup-*.exe
          if-no-files-found: error

  macos-dmg:
    if: github.repository == 'SukinShetty/mybuildy'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No Apple Developer certificate: electron-builder's own signing is off
      # (mac.identity null) and scripts/after-pack.js ad-hoc signs the .app.
      - name: Package macOS DMGs (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      # Tag, package.json and the packaged apps must all carry the same version.
      - name: Check versions agree
        run: node scripts/check-release-version.mjs ${{ github.ref_name }}

      - name: Verify the ad-hoc signature of each packaged app
        run: |
          for app in dist/mac*/MyBuildy.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MyBuildy-*.dmg
          if-no-files-found: error

  draft-release:
    needs: [windows-installer, macos-dmg]
    if: github.repository == 'SukinShetty/mybuildy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum MyBuildy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Replaces each file in place on the existing release (draft or published),
      # SHA256SUMS.txt last, then re-downloads every file and checks its SHA256.
      - name: Put the files on the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-assets.mjs ${{ github.ref_name }} release
