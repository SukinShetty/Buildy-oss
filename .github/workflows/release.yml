# release.yml — Windows installer on version tags (v*), as a DRAFT release.
#
# v1.0.0 ships a Windows installer only: macOS is untested (no Mac available;
# unsigned Apple-silicon apps open as "damaged"), so macOS and Linux stay
# "run from source, untested". Guarded to the canonical repo so forks pushing
# tags don't try to cut releases.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    if: github.repository == 'SukinShetty/Buildy-oss'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: npm 10+ crashes with an arborist
      # "edgesOut" error on a clean install without it (same as ci.yml).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'Buildy-Setup-*.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Buildy-Setup-*.exe
            dist/SHA256SUMS.txt
